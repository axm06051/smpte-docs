services:
  smpte:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Leave empty on a trusted LAN.
      MCP_TOKEN: ${MCP_TOKEN:-}
    restart: unless-stopped

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    depends_on:
      - smpte
    environment:
      BASE_URL: http://smpte:${PORT:-3000}
    profiles:
      - test
